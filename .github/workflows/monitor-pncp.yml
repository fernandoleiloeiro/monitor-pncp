name: Monitor PNCP - leilão/leiloeiro

on:
  schedule:
    - cron: "*/30 * * * *"   # reserva; o cron-job.org dispara a cada 5 minutos
  workflow_dispatch:          # permite rodar manualmente

permissions:
  contents: write

concurrency:
  group: monitor-pncp
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar PNCP
        env:
          TERMOS: ${{ vars.TERMOS }}
          UFS: ${{ vars.UFS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: python monitor_pncp.py
      - name: Salvar publicações já vistas
        run: |
          git config user.name "monitor-pncp"
          git config user.email "monitor-pncp@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || (git commit -m "Atualiza publicações vistas" && git push)
